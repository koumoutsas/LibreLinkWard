name: CI
on:
  push:
    branches: [development, multi-patient]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test (${{ matrix.os }})
    # macOS runs on the maintainer's self-hosted Mac for pushes (hosted macOS
    # capacity is unreliable). Pull requests always use GitHub-hosted runners so
    # untrusted fork code never runs on that machine.
    runs-on: ${{ (matrix.os == 'macos-latest' && github.event_name == 'push') && fromJSON('["self-hosted","librelinkward-mac"]') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Temporarily macOS only (self-hosted runner) while verifying the
        # Electron 45 / electron-builder 26 upgrade; restore ubuntu-latest and
        # windows-latest afterwards.
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --prefer-offline --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      # The inherited ESLint setup is still on eslintrc and reports many existing
      # errors, so lint is advisory until it is cleaned up.
      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'
      - name: Unit and integration tests with coverage gate
        run: npm run test:coverage

  e2e:
    name: E2E smoke (${{ matrix.os }})
    needs: check
    # macOS runs on the maintainer's self-hosted Mac for pushes (hosted macOS
    # capacity is unreliable). Pull requests always use GitHub-hosted runners so
    # untrusted fork code never runs on that machine.
    runs-on: ${{ (matrix.os == 'macos-latest' && github.event_name == 'push') && fromJSON('["self-hosted","librelinkward-mac"]') || matrix.os }}
    # Linux is best-effort (not a primary target).
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # Temporarily macOS only (self-hosted runner) while verifying the
        # Electron 45 / electron-builder 26 upgrade; restore ubuntu-latest and
        # windows-latest afterwards.
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --prefer-offline --legacy-peer-deps
      - name: Package unpacked app
        run: npm run package:dir
      # The app encrypts credentials with the macOS keychain (safeStorage). A runner service has no unlocked login
      # keychain (errSecInteractionNotAllowed), so the test gets a throwaway one; the previous setup is restored after.
      - name: Use a throwaway keychain (macOS)
        if: runner.os == 'macOS'
        run: |
          KEYCHAIN="$RUNNER_TEMP/e2e.keychain-db"
          echo "PREV_DEFAULT_KEYCHAIN=$(security default-keychain -d user | tr -d ' "')" >> "$GITHUB_ENV"
          echo "PREV_KEYCHAIN_LIST=$(security list-keychains -d user | tr -d ' "' | tr '\n' ':')" >> "$GITHUB_ENV"
          echo "E2E_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p e2e "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p e2e "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"
      - name: Run Playwright smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e
      - name: Run Playwright smoke test
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: Restore keychains (macOS)
        if: always() && runner.os == 'macOS' && env.E2E_KEYCHAIN != ''
        run: |
          IFS=':' read -ra LIST <<< "$PREV_KEYCHAIN_LIST"
          [ -n "$PREV_DEFAULT_KEYCHAIN" ] && security default-keychain -d user -s "$PREV_DEFAULT_KEYCHAIN"
          [ ${#LIST[@]} -gt 0 ] && security list-keychains -d user -s "${LIST[@]}"
          security delete-keychain "$E2E_KEYCHAIN" || true

  mutation:
    name: Mutation testing (src/shared)
    needs: check
    # Hosted Linux runner: slow (full run ~10 minutes) and unrelated to the
    # macOS-specific checks above. Incremental, so later runs only re-test
    # mutants affected by changes. Fails below the `break` threshold in
    # stryker.config.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --prefer-offline --legacy-peer-deps
      - name: Restore incremental state
        uses: actions/cache@v6
        with:
          path: .stryker-tmp/incremental.json
          key: stryker-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ github.ref_name }}-
            stryker-development-
      - name: Mutation tests
        run: npm run test:mutation -- --reporters clear-text,progress
