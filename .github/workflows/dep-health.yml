name: Dependency health

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefer-offline --legacy-peer-deps --ignore-scripts

      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Find deprecated packages
        id: deprecated
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/check-deprecated.js | tee deprecated.txt

      - name: Report outdated packages
        run: |
          {
            echo '### Outdated (non-major)'
            echo '```'
            npx --yes npm-check-updates --target minor || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report deprecated packages
        if: steps.deprecated.outcome == 'failure'
        run: |
          {
            echo '### Deprecated packages'
            cat deprecated.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on audit or deprecation findings
        if: steps.audit.outcome == 'failure' || steps.deprecated.outcome == 'failure'
        run: exit 1
